# Licences accepted for crates linked into key-server and seal-cli. A dependency under any other licence
# fails the image build (`cargo about generate --fail`): review it, then add it here deliberately.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
workarounds = ["ring"]
