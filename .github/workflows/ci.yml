name: CI
# Gate for the contingency seal-key-server image. Runs on every push and PR, and the release workflow
# reuses it on the tagged commit (workflow_call), so a tag cannot skip a check.
#   - hadolint, actionlint, Trivy configuration scan
#   - an amd64 build that is not pushed (it includes the third-party licence notices stage: a dependency under an
#     unaccepted licence fails the build), scanned with Trivy (fixable CRITICAL/HIGH fail)
#   - a smoke test of the built image: non-root user, seal-cli runs, key-server refuses to start
#     without configuration

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    timeout-minutes: 15
    name: Lint (hadolint, actionlint, Trivy config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo docker.io/rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 -color
      - name: Trivy configuration scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          version: v0.74.0

  image:
    timeout-minutes: 90
    name: Build, scan and smoke-test (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # No registry login in this workflow: it compiles third-party code and pushes nothing.
      - name: Build (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: seal-key-server:ci
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max

      - name: Scan the image (fail on fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: seal-key-server:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          version: v0.74.0

      - name: Smoke test
        run: bash scripts/smoke.sh seal-key-server:ci
