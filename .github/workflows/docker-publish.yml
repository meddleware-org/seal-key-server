name: Publish (Docker)
# Release pipeline for the contingency seal-key-server image (workspace ADR-0002). Fires on v* tags.
#   - Upstream MystenLabs/seal pinned by release tag + commit (Dockerfile ARGs)
#   - The same checks as CI on the tagged commit (workflow_call), then a Trivy scan of the image before signing
#   - Native amd64 and arm64 builds, run WITHOUT registry credentials (OCI archives), pushed by a short
#     job that holds them, then merged into one multi-arch manifest
#   - Exact version tags only (no `latest`, no `{major}.{minor}`); deploy by the signed index digest
#   - Keyless cosign signatures, SPDX SBOM attestation, GitHub build-provenance attestation
#
# Required repository configuration:
#   Secrets: QUAY_USERNAME/QUAY_TOKEN, DOCKERHUB_USERNAME/DOCKERHUB_TOKEN
#   Vars (optional overrides): QUAY_NAMESPACE, DOCKERHUB_NAMESPACE
on:
  push:
    tags:
      - "v*"

env:
  # No tool in the pipeline may send telemetry.
  DO_NOT_TRACK: "1"
  IMAGE: seal-key-server

permissions:
  contents: read

jobs:
  # Decide the version and whether this run publishes.
  version:
    # Refuse a tag that disagrees with the VERSION file.
    name: Tag matches VERSION
    runs-on: ubuntu-latest
    steps:
      # The tagged commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(cat VERSION)"
          # A tag that disagrees with the VERSION file would publish an image labelled with another number.
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::tag ${TAG} does not match VERSION ${VERSION}"
            exit 1
          fi

  # The release runs exactly what CI runs (lint, licences, image scan, smoke test) on the tagged commit.
  verify:
    name: Verify (CI checks)
    uses: ./.github/workflows/ci.yml

  # The builds compile hundreds of third-party crates, so they hold no registry credentials: each exports
  # an OCI archive, and a separate short job (publish-arch) logs in only to push it.
  build:
    name: Build ${{ matrix.arch }}
    needs: [version, verify]
    strategy:
      matrix:
        # One build per architecture, each on a native runner.
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            # Native runner per architecture: a Rust release build under QEMU would take hours.
            runner: ubuntu-24.04-arm
    # The runner that matches the architecture being built.
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The image label carries the version without the tag's leading `v` (F15), as the tags do.
      - name: Image version (the tag without its `v`)
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Build (OCI archive, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          # Export an OCI archive instead of pushing: this job holds no registry credentials.
          outputs: type=oci,dest=${{ runner.temp }}/${{ matrix.arch }}.tar
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
          # BuildKit provenance, kept through the merge.
          provenance: mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
      # Hand the archive to the job that pushes it; it is kept for one day only.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oci-${{ matrix.arch }}
          path: ${{ runner.temp }}/${{ matrix.arch }}.tar
          retention-days: 1
          if-no-files-found: error

  # Push each architecture image under a build-only tag; this is the only job before the merge that holds registry credentials.
  publish-arch:
    name: Push ${{ matrix.arch }} (quay.io + Docker Hub)
    # Wait for both architecture builds.
    needs: build
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Fetch the archive this architecture built.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: oci-${{ matrix.arch }}
          path: oci
      # skopeo copies the OCI archive to the registries without a Docker daemon.
      - name: Install skopeo if the runner image lacks it
        run: command -v skopeo > /dev/null || { sudo apt-get update && sudo apt-get install -y --no-install-recommends skopeo; }

      # Registry logins use repository secrets; nothing here prints them.
      - name: Log in to quay.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      # The second public registry, with its own credentials.
      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --all keeps the image manifest and its provenance attestation. The per-architecture tags are
      # build intermediates: deploy by the signed index digest only (README).
      - name: Push the architecture image
        env:
          ARCH: ${{ matrix.arch }}
          QUAY_NS: ${{ vars.QUAY_NAMESPACE || 'meddleware-org' }}
          DOCKERHUB_NS: ${{ vars.DOCKERHUB_NAMESPACE || 'meddleware' }}
          SHA: ${{ github.sha }}
        run: |
          skopeo copy --all "oci-archive:oci/${ARCH}.tar" "docker://quay.io/${QUAY_NS}/${IMAGE}:${SHA}-${ARCH}"
          skopeo copy --all "oci-archive:oci/${ARCH}.tar" "docker://docker.io/${DOCKERHUB_NS}/${IMAGE}:${SHA}-${ARCH}"

  # Join the architecture images into one index on both registries, then scan, sign and attest it.
  merge-docker-public:
    name: Merge + sign (quay.io + Docker Hub)
    # Wait for both architecture images to be pushed.
    needs: publish-arch
    # Each job runs on a fresh runner, so this one logs in again below.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Keyless signing and the attestation use the workflow's OIDC identity.
      id-token: write
      # Build provenance attestations are written to the repository.
      attestations: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to quay.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Exact version tags only (no `latest`), and the OCI labels.
      - name: Compute final tags and labels
        id: meta
        # The step id the merge step reads the tags from.
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            quay.io/${{ vars.QUAY_NAMESPACE || 'meddleware-org' }}/${{ env.IMAGE }}
            docker.io/${{ vars.DOCKERHUB_NAMESPACE || 'meddleware' }}/${{ env.IMAGE }}
          # Exact version tags only (OQ3): a floating tag (`latest`, `0.0`) gives a deployer nothing the signed
          # index digest does not, and invites a silent move. The weekly rescan reads the newest exact tag.
          tags: |
            type=semver,pattern={{version}}
          # No `latest` tag is ever added.
          flavor: |
            latest=false

      # One index over the two architecture images; both registries get the same digest.
      - name: Merge multi-arch manifests
        id: merge
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          QUAY_NS: ${{ vars.QUAY_NAMESPACE || 'meddleware-org' }}
          DOCKERHUB_NS: ${{ vars.DOCKERHUB_NAMESPACE || 'meddleware' }}
          SHA: ${{ github.sha }}
        run: |
          # The per-architecture images were pushed under the commit-sha tags by the previous job.
          QUAY_SRC="quay.io/${QUAY_NS}/${IMAGE}:${SHA}"
          HUB_SRC="docker.io/${DOCKERHUB_NS}/${IMAGE}:${SHA}"

          QUAY_FLAGS=()
          HUB_FLAGS=()
          while IFS= read -r tag; do
            if [[ "$tag" == quay.io/* ]]; then
              QUAY_FLAGS+=(--tag "$tag")
            elif [[ "$tag" == docker.io/* ]]; then
              HUB_FLAGS+=(--tag "$tag")
            fi
          done <<< "${TAGS}"

          docker buildx imagetools create "${QUAY_FLAGS[@]}" "${QUAY_SRC}-amd64" "${QUAY_SRC}-arm64"
          docker buildx imagetools create "${HUB_FLAGS[@]}"   "${HUB_SRC}-amd64"  "${HUB_SRC}-arm64"

          PRIMARY=$(echo "${TAGS}" | grep 'quay.io' | head -1)
          DIGEST=$(docker buildx imagetools inspect "${PRIMARY}" --format '{{.Manifest.Digest}}')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      # Scan by digest before anything is signed: a failing scan means no signature, so verifiers never accept a vulnerable image.
      - name: Scan the published image's OS packages (fail on fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: quay.io/${{ vars.QUAY_NAMESPACE || 'meddleware-org' }}/${{ env.IMAGE }}@${{ steps.merge.outputs.digest }}
          vuln-type: os
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          version: v0.74.0

      # Report only until the maintainer decides what to do with the advisories the pinned upstream release
      # carries (audit F13, OQ5); the crates are visible because the binaries are built with `cargo auditable`.
      - name: Crate advisories of the published image (fixable CRITICAL/HIGH; report only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: quay.io/${{ vars.QUAY_NAMESPACE || 'meddleware-org' }}/${{ env.IMAGE }}@${{ steps.merge.outputs.digest }}
          vuln-type: library
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: true
          version: v0.74.0

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Keyless signatures over the index digest, from the tag's workflow identity.
      - name: Sign images (keyless)
        env:
          DIGEST: ${{ steps.merge.outputs.digest }}
          QUAY_NS: ${{ vars.QUAY_NAMESPACE || 'meddleware-org' }}
          DOCKERHUB_NS: ${{ vars.DOCKERHUB_NAMESPACE || 'meddleware' }}
        run: |
          cosign sign --yes "quay.io/${QUAY_NS}/${IMAGE}@${DIGEST}"
          cosign sign --yes "docker.io/${DOCKERHUB_NS}/${IMAGE}@${DIGEST}"

      # SBOM of the published image, attached as a signed cosign attestation (SPDX JSON).
      - name: Generate SBOM
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          image: quay.io/${{ vars.QUAY_NAMESPACE || 'meddleware-org' }}/${{ env.IMAGE }}@${{ steps.merge.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      # The SBOM must list the crates compiled into the binaries, not only the distroless OS packages (F13).
      - name: The SBOM lists the compiled crates
        run: |
          n="$(jq '[.packages[]? | .externalRefs[]? | select(.referenceType == "purl") | .referenceLocator | select(startswith("pkg:cargo/"))] | length' sbom.spdx.json)"
          echo "crates in the SBOM: ${n}"
          test "${n}" -ge 100

      # Sign the SBOM against the same digest.
      - name: Attest SBOM (keyless)
        env:
          DIGEST: ${{ steps.merge.outputs.digest }}
          QUAY_NS: ${{ vars.QUAY_NAMESPACE || 'meddleware-org' }}
          DOCKERHUB_NS: ${{ vars.DOCKERHUB_NAMESPACE || 'meddleware' }}
        run: |
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "quay.io/${QUAY_NS}/${IMAGE}@${DIGEST}"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "docker.io/${DOCKERHUB_NS}/${IMAGE}@${DIGEST}"

      # GitHub-native provenance, pushed beside the image.
      - name: Attest build provenance (quay.io)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: quay.io/${{ vars.QUAY_NAMESPACE || 'meddleware-org' }}/${{ env.IMAGE }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true

      # The same provenance for the Docker Hub copy.
      - name: Attest build provenance (Docker Hub)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: docker.io/${{ vars.DOCKERHUB_NAMESPACE || 'meddleware' }}/${{ env.IMAGE }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true

      # The digest and the command anyone can run to verify the signature.
      - name: Summary
        run: |
          echo "Published & signed @ ${{ steps.merge.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Verify: cosign verify --certificate-identity-regexp '^https://github.com/meddleware-org/seal-key-server/\\.github/workflows/docker-publish\\.yml@refs/tags/v' --certificate-oidc-issuer https://token.actions.githubusercontent.com <image>@<digest>" >> "$GITHUB_STEP_SUMMARY"
