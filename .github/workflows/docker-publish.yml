name: Publish (Docker)
# Release pipeline for the contingency seal-key-server image (workspace ADR-0002). Fires on v* tags.
#   - Upstream MystenLabs/seal pinned by release tag + commit (Dockerfile ARGs)
#   - Native amd64 and arm64 builds merged into one multi-arch manifest
#   - Keyless cosign signatures, SPDX SBOM attestation, GitHub build-provenance attestation
#
# Required repository configuration:
#   Secrets: QUAY_USERNAME/QUAY_TOKEN, DOCKERHUB_USERNAME/DOCKERHUB_TOKEN
#   Vars (optional overrides): QUAY_NAMESPACE, DOCKERHUB_NAMESPACE
on:
  push:
    tags:
      - "v*"

env:
  IMAGE: seal-key-server

permissions:
  contents: read

jobs:
  verify:
    name: Verify (version, hadolint, actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag matches VERSION
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(cat VERSION)"
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::tag ${TAG} does not match VERSION ${VERSION}"
            exit 1
          fi
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo docker.io/rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 -color

  build-amd64:
    name: Docker amd64 (quay.io + Docker Hub)
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Native runner per architecture: a Rust release build under QEMU would take hours.
      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            quay.io/${{ vars.QUAY_NAMESPACE || 'meddleware-org' }}/${{ env.IMAGE }}:${{ github.sha }}-amd64
            docker.io/${{ vars.DOCKERHUB_NAMESPACE || 'meddleware' }}/${{ env.IMAGE }}:${{ github.sha }}-amd64
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max
          provenance: mode=max
          build-args: |
            VERSION=${{ github.ref_name }}

  build-arm64:
    name: Docker arm64 (quay.io + Docker Hub)
    runs-on: ubuntu-24.04-arm
    needs: verify
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Native runner per architecture: a Rust release build under QEMU would take hours.
      - name: Build and push (linux/arm64)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            quay.io/${{ vars.QUAY_NAMESPACE || 'meddleware-org' }}/${{ env.IMAGE }}:${{ github.sha }}-arm64
            docker.io/${{ vars.DOCKERHUB_NAMESPACE || 'meddleware' }}/${{ env.IMAGE }}:${{ github.sha }}-arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max
          provenance: mode=max
          build-args: |
            VERSION=${{ github.ref_name }}

  merge-docker-public:
    name: Merge + sign (quay.io + Docker Hub)
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute final tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            quay.io/${{ vars.QUAY_NAMESPACE || 'meddleware-org' }}/${{ env.IMAGE }}
            docker.io/${{ vars.DOCKERHUB_NAMESPACE || 'meddleware' }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto

      - name: Merge multi-arch manifests
        id: merge
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          QUAY_NS: ${{ vars.QUAY_NAMESPACE || 'meddleware-org' }}
          DOCKERHUB_NS: ${{ vars.DOCKERHUB_NAMESPACE || 'meddleware' }}
          SHA: ${{ github.sha }}
        run: |
          QUAY_SRC="quay.io/${QUAY_NS}/${IMAGE}:${SHA}"
          HUB_SRC="docker.io/${DOCKERHUB_NS}/${IMAGE}:${SHA}"

          QUAY_FLAGS=()
          HUB_FLAGS=()
          while IFS= read -r tag; do
            if [[ "$tag" == quay.io/* ]]; then
              QUAY_FLAGS+=(--tag "$tag")
            elif [[ "$tag" == docker.io/* ]]; then
              HUB_FLAGS+=(--tag "$tag")
            fi
          done <<< "${TAGS}"

          docker buildx imagetools create "${QUAY_FLAGS[@]}" "${QUAY_SRC}-amd64" "${QUAY_SRC}-arm64"
          docker buildx imagetools create "${HUB_FLAGS[@]}"   "${HUB_SRC}-amd64"  "${HUB_SRC}-arm64"

          PRIMARY=$(echo "${TAGS}" | grep 'quay.io' | grep -v 'latest' | head -1)
          DIGEST=$(docker buildx imagetools inspect "${PRIMARY}" --format '{{.Manifest.Digest}}')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign images (keyless)
        env:
          DIGEST: ${{ steps.merge.outputs.digest }}
          QUAY_NS: ${{ vars.QUAY_NAMESPACE || 'meddleware-org' }}
          DOCKERHUB_NS: ${{ vars.DOCKERHUB_NAMESPACE || 'meddleware' }}
        run: |
          cosign sign --yes "quay.io/${QUAY_NS}/${IMAGE}@${DIGEST}"
          cosign sign --yes "docker.io/${DOCKERHUB_NS}/${IMAGE}@${DIGEST}"

      # SBOM of the published image, attached as a signed cosign attestation (SPDX JSON).
      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: quay.io/${{ vars.QUAY_NAMESPACE || 'meddleware-org' }}/${{ env.IMAGE }}@${{ steps.merge.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Attest SBOM (keyless)
        env:
          DIGEST: ${{ steps.merge.outputs.digest }}
          QUAY_NS: ${{ vars.QUAY_NAMESPACE || 'meddleware-org' }}
          DOCKERHUB_NS: ${{ vars.DOCKERHUB_NAMESPACE || 'meddleware' }}
        run: |
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "quay.io/${QUAY_NS}/${IMAGE}@${DIGEST}"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "docker.io/${DOCKERHUB_NS}/${IMAGE}@${DIGEST}"

      - name: Attest build provenance (quay.io)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: quay.io/${{ vars.QUAY_NAMESPACE || 'meddleware-org' }}/${{ env.IMAGE }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true

      - name: Attest build provenance (Docker Hub)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: docker.io/${{ vars.DOCKERHUB_NAMESPACE || 'meddleware' }}/${{ env.IMAGE }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true

      - name: Summary
        run: echo "Published & signed @ ${{ steps.merge.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
