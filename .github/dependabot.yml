# Dependabot: weekly, grouped update pull requests for the Docker base-image digests and the GitHub Actions (the fleet policy, D41 and D52, in the workspace docs/audit/LENS_GROUNDING_LOG.md).
version: 2
updates:
  # Base-image digests. The Rust image is excluded: its version must equal the upstream release's
  # rust-toolchain.toml (a different toolchain makes rustup download one at build time), so it moves
  # with SEAL_TAG, which the weekly upstream watch announces.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Five open at a time keeps the queue reviewable.
    open-pull-requests-limit: 5
    groups:
      # One pull request moves every image digest together.
      docker:
        patterns: ['*']
    # Never bumped by a bot: see the note at the top of this block (D147; lifted when SEAL_TAG moves to a release with a new toolchain).
    ignore:
      - dependency-name: rust
      - dependency-name: library/rust
  # Actions are pinned by full commit SHA (D12); one pull request moves every pin together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ['*']
